name: "Import TEMPT1 archive"

# Puts the recovered TEMPT1 material into the deployed database: attaches the
# eyetag images, repairs the two GML files MySQL truncated in 2009, and creates
# the tags that were never uploaded here.
#
# Deliberately not a migration. `rake tempt1:import` reaches the network for a
# pinned release tarball, writes Active Storage blobs, and is built to be
# re-run after a partial failure. A migration would record itself as done and
# take that away, and it would fire during CI and every fresh dev setup.
#
# Run this from the Actions tab. With the confirm box empty it only reports
# what it would do, so looking first costs nothing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type IMPORT to write. Anything else is a dry run."
        required: false
        default: ""

jobs:
  import:
    name: Import TEMPT1 archive
    runs-on: ubuntu-latest
    # Shares the lock with deploys and migrations: kamal takes a host lock, and
    # this should not race a container rollover mid-import.
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      BETA_HOST: ${{ vars.BETA_HOST || '159.203.72.141' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Add the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_SSH_PRIVATE_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$BETA_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write the secrets Kamal reads
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          {
            printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
          } > .kamal/secrets-common

      # Always runs. Writes nothing, and reports exactly what the real run would
      # change, so the confirm box is an informed decision rather than a guess.
      - name: Report what the import would do
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal app exec --reuse "bin/rails tempt1:verify" 2>&1 | tail -40

      - name: Import
        if: inputs.confirm == 'IMPORT'
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal app exec --reuse "bin/rails tempt1:import"

      # The task is idempotent, so a second pass over a finished import should
      # report nothing left to do. If it does not, the first pass was partial.
      - name: Confirm nothing is left to do
        if: inputs.confirm == 'IMPORT'
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal app exec --reuse "bin/rails tempt1:verify" 2>&1 | tail -20

      - name: Clean up
        if: always()
        run: rm -f config/master.key .kamal/secrets-common
