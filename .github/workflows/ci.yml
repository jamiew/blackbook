name: "CI Tests"

# One pipeline: test and lint on every push, and deploy beta only when both
# pass. Job names are kept as Test and RuboCop so existing branch protection
# and PR checks keep matching.
on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        # Match the server. Keep this, compose.yaml and the server in step:
        # testing against a different major version is how the utf8mb3 and
        # MyISAM index-limit problems went unnoticed for so long.
        image: mysql:8.4
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=3
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306
        # No collation args here: unlike compose.yaml, a service container
        # takes no command override. It does not matter, because `rake
        # db:create` builds the database with the collation in database.yml
        # rather than inheriting the server default.

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          MYSQL_PASSWORD: ""
          # Same knob developers use locally, rather than a second way of
          # spelling the connection that can drift from database.yml.
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load --trace
          bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop --format github

  deploy:
    name: Deploy beta
    needs: [test, rubocop]
    if: github.ref == 'refs/heads/upgrade-migrations'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to ghcr.io, so no personal token is needed.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # An amd64 runner builds natively. A laptop on arm64 has to cross-compile
      # under QEMU, which turned a short build into roughly nine minutes.
      - uses: docker/setup-buildx-action@v3

      - name: Add the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_SSH_PRIVATE_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          # Unhashed and one key type on purpose. `ssh-keyscan -H` returns rsa,
          # ecdsa and ed25519 in no fixed order, and net-ssh then sometimes
          # compares against a different one and reports a host key mismatch.
          ssh-keyscan -t ed25519 "${{ vars.BETA_HOST || '159.203.72.141' }}" \
            >> ~/.ssh/known_hosts 2>/dev/null
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

      - name: Write the secrets Kamal reads
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
          # Kamal reads this from a secrets file, not from the environment.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same files and precedence a laptop uses, so there is one code path.
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          {
            printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
          } > .kamal/secrets-common

      # Kamal starts an existing kamal-proxy container rather than recreating
      # it. If that container was created by a run that failed partway, as
      # happened when nginx still held port 80, it can end up attached to no
      # network at all, and then the proxy can never reach the app however
      # healthy the app is. The symptom is a health check that always times
      # out. Recreate it when that has happened.
      - name: Ensure the host is ready for the container
        env:
          HOST: ${{ vars.BETA_HOST || '159.203.72.141' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "root@$HOST" '
            # MySQL runs on the host. The app container sits on the kamal
            # network (172.18.x), not docker0 (172.17.x), and ufw defaults to
            # denying incoming, so container-to-host traffic on 3306 was
            # dropped. Only requests touching the database hung; /up and static
            # files were fine, which is what made it look like a health check
            # problem.
            for net in 172.17.0.0/16 172.18.0.0/16; do
              ufw status | grep -q "3306.*$net" || ufw allow from "$net" to any port 3306 proto tcp >/dev/null
            done

            # The grant was for 172.17.% while the app connects from the kamal
            # network at 172.18.x, so MySQL refused it. RENAME USER widens the
            # host without needing to know the password, and carries the
            # existing privileges across.
            if mysql -N -e "SELECT 1 FROM mysql.user WHERE user=\"blackbook\" AND host=\"172.17.%\"" | grep -q 1; then
              mysql -e "RENAME USER \"blackbook\"@\"172.17.%\" TO \"blackbook\"@\"172.%\"" && echo "widened grant to 172.%"
            fi
            mysql -N -e "SELECT CONCAT(\"grant: \", user, \"@\", host) FROM mysql.user WHERE user=\"blackbook\""

            cnf=/etc/mysql/mysql.conf.d/mysqld.cnf
            needs_restart=0

            # TCP connects but the handshake never finishes: MySQL does a
            # reverse DNS lookup on each connecting address, and a container
            # subnet has no PTR record, so every connection stalls until that
            # lookup gives up. Safe here because the grants are IP patterns,
            # not hostnames.
            if ! grep -q "^skip-name-resolve" "$cnf" 2>/dev/null; then
              printf "\nskip-name-resolve\n" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              needs_restart=1
              echo "enabled skip-name-resolve"
            fi

            # Bind to every docker bridge that exists, not just docker0.
            binds=$(ip -4 -o addr show | awk "/172\.1[78]\./ {split(\$4,a,\"/\"); printf \"%s,\", a[1]}")
            want="127.0.0.1,${binds%,}"
            if ! grep -q "^bind-address[[:space:]]*=[[:space:]]*$want\$" "$cnf"; then
              sed -i "s|^bind-address.*|bind-address = $want|" "$cnf"
              needs_restart=1
              echo "mysql now binds: $want"
            else
              echo "mysql already binds: $want"
            fi

            [ "$needs_restart" = "1" ] && systemctl restart mysql && echo "mysql restarted"
            true
          '

          ssh -o StrictHostKeyChecking=accept-new "root@$HOST" '
            if docker inspect kamal-proxy >/dev/null 2>&1; then
              nets=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" kamal-proxy)
              case "$nets" in
                *kamal*) echo "kamal-proxy is on: $nets" ;;
                *)       echo "kamal-proxy on no network, recreating"; docker rm -f kamal-proxy ;;
              esac
            fi
          '

      - name: Deploy
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal deploy

      - name: Smoke test the deployed site
        env:
          URL: https://beta.000000book.com
        run: |
          fail=0
          for path in /up / /data; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL$path" || echo timeout)
            echo "$path -> $code"
            case "$code" in 200|301|302) ;; *) fail=1 ;; esac
          done
          if [ "$fail" = "1" ]; then
            echo "--- can the app reach the database? ---"
            ssh -o StrictHostKeyChecking=accept-new "root@${{ vars.BETA_HOST || '159.203.72.141' }}" '
              c=$(docker ps -q --filter "name=blackbook-web" | head -1)
              echo "resolving host.docker.internal:"
              docker exec "$c" getent hosts host.docker.internal || echo "  does not resolve"
              echo "tcp reachable on 3306:"
              docker exec "$c" timeout 8 bash -c "cat < /dev/null > /dev/tcp/host.docker.internal/3306" \
                && echo "  yes" || echo "  no"
              echo "what Rails says:"
              docker exec "$c" timeout 60 bin/rails runner /rails/script/db_doctor.rb 2>&1 | tail -5
            '
            echo "--- app logs ---"
            ssh -o StrictHostKeyChecking=accept-new "root@${{ vars.BETA_HOST || '159.203.72.141' }}" \
              'docker logs $(docker ps -q --filter "name=blackbook-web" | head -1) 2>&1 \
                 | grep -v "/usr/local/bundle" | tail -40'
            exit 1
          fi

      # A failed health check says only "target failed to become healthy",
      # which does not distinguish a container that never bound its port from
      # one answering with a non-200. This asks the container directly.
      - name: Diagnose a failed deploy
        if: failure()
        env:
          HOST: ${{ vars.BETA_HOST || '159.203.72.141' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "root@$HOST" '
            old=$(docker ps -aq --filter "name=blackbook-web" | head -1)
            [ -z "$old" ] && { echo "no app container found"; exit 0; }
            # The probe is attached to the kamal network by hand. If the real
            # container is not, kamal-proxy cannot reach it however healthy the
            # app is.
            echo "=== the container Kamal actually deployed ==="
            docker inspect -f "networks: {{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" "$old"
            docker inspect -f "state: {{.State.Status}} exit={{.State.ExitCode}}" "$old"
            echo "=== did it ever receive a /up request? ==="
            docker logs "$old" 2>&1 | grep -c "/up" || echo "0 requests logged"
            echo "=== kamal-proxy networks ==="
            docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" kamal-proxy 2>/dev/null || true
            img=$(docker inspect -f "{{.Config.Image}}" "$old")
            docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$old" > /root/probe.env
            docker rm -f probe >/dev/null 2>&1 || true
            docker run -d --name probe --network kamal               --add-host=host.docker.internal:host-gateway               --env-file /root/probe.env "$img" >/dev/null
            for i in $(seq 1 12); do
              code=$(docker exec probe curl -s -o /dev/null -w "%{http_code}" --max-time 5                 http://localhost/up 2>/dev/null || echo "refused")
              echo "t+$((i*5))s  /up -> $code"
              [ "$code" = "200" ] && break
              sleep 5
            done
            # The probe reaches /up on localhost, but kamal-proxy calls the
            # container across the kamal network. That path is the last
            # untested difference between the two.
            echo "--- reachable across the docker network? ---"
            ip=$(docker inspect -f "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}" probe)
            echo "probe ip: $ip"
            docker run --rm --network kamal curlimages/curl:latest \
              -s -o /dev/null -w "by name: %{http_code}\n" --max-time 8 http://probe/up 2>&1 | tail -1
            docker run --rm --network kamal curlimages/curl:latest \
              -s -o /dev/null -w "by ip:   %{http_code}\n" --max-time 8 "http://$ip/up" 2>&1 | tail -1
            echo "--- is the block volume actually mounted? ---"
            mountpoint /mnt/blackbook_volume || echo "NOT MOUNTED"
            echo "gml files on host: $(ls /mnt/blackbook_volume/blackbook-data 2>/dev/null | wc -l)"
            echo "--- mount ownership, app runs as uid 1000 ---"
            docker exec probe sh -c "ls -ldn /rails/data /rails/public/system /rails/storage" 2>&1 | head -4 || true
            echo "--- listening inside the container ---"
            docker exec probe sh -c "(ss -lntp || netstat -lntp) 2>/dev/null | head -6" || true
            echo "--- container status ---"
            docker ps -a --filter name=probe --format "{{.Status}}"
            echo "--- last 30 log lines ---"
            docker logs probe 2>&1 | tail -30
            docker rm -f probe >/dev/null 2>&1; rm -f /root/probe.env
          '

      # Deliberately NOT automatic. The pending set drops a 301,076-row table,
      # so migrating is a decision, not a side effect of shipping code. Run it
      # with: bin/kamal migrate
      - name: Remind about migrations
        run: |
          echo "Deployed. Migrations were not run." >> $GITHUB_STEP_SUMMARY
          echo "Run them deliberately with: bin/kamal migrate" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: rm -f config/master.key .kamal/secrets-common
