name: "CI Tests"

on: push

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        # Match the server. Keep this, compose.yaml and the server in step:
        # testing against a different major version is how the utf8mb3 and
        # MyISAM index-limit problems went unnoticed for so long.
        image: mysql:8.4
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DB: blackbook_test
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cache Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install Gems
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run tests
        env:
          RAILS_ENV: test
          MYSQL_PASSWORD: ""
          DATABASE_URL: mysql2://127.0.0.1:${{ job.services.mysql.ports[3306] }}/blackbook_test
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load --trace
          bundle exec rspec
