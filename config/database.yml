default: &default
  adapter: mysql2
  # `utf8` is MySQL's alias for utf8mb3, which cannot carry 4-byte characters.
  # Leaving it here would defeat the utf8mb4 tables: the connection itself
  # would still refuse emoji. Collation is pinned so a freshly created dev or
  # test database compares strings the same way production does.
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: 5
  host: 127.0.0.1
  # Defaults to the MySQL 8.4 that compose.yaml runs, which is the version the
  # server runs. Development used to point at whatever MySQL was on the laptop,
  # which is how a version gap opened up between here and production.
  # Set MYSQL_PORT to use a different server.
  port: <%= ENV.fetch('MYSQL_PORT', 13306) %>
  username: root
  password: <%= ENV.fetch('MYSQL_PASSWORD', '') %>

development:
  <<: *default
  database: blackbook_dev

test:
  <<: *default
  database: blackbook_test

production:
  <<: *default
  # DATABASE_URL must name localhost as its host. MySQL runs on the same
  # machine, so the app reaches it over the Unix socket below rather than over
  # TCP. Every TCP route from the container timed out at connect, whatever the
  # TLS settings, while the socket answers immediately, and the socket needs no
  # bridge address, firewall rule or certificate to keep working.
  url: <%= ENV['DATABASE_URL'] %>
  # Keys the URL does not set survive the merge, so this is the default and the
  # URL can still override it.
  socket: <%= ENV.fetch('MYSQL_SOCKET', '/var/run/mysqld/mysqld.sock') %>
  # Without a timeout an unreachable database hangs each request until the OS
  # gives up, which reads as a slow app rather than as a database it cannot
  # reach. That is what turned this into a 504 instead of an error.
  connect_timeout: 5
