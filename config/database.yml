default: &default
  adapter: mysql2
  # `utf8` is MySQL's alias for utf8mb3, which cannot carry 4-byte characters.
  # Leaving it here would defeat the utf8mb4 tables: the connection itself
  # would still refuse emoji. Collation is pinned so a freshly created dev or
  # test database compares strings the same way production does.
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: 5
  host: 127.0.0.1
  # Defaults to the MySQL 8.4 that compose.yaml runs, which is the version the
  # server runs. Development used to point at whatever MySQL was on the laptop,
  # which is how a version gap opened up between here and production.
  # Set MYSQL_PORT to use a different server.
  port: <%= ENV.fetch('MYSQL_PORT', 13306) %>
  username: root
  password: <%= ENV.fetch('MYSQL_PASSWORD', '') %>

development:
  <<: *default
  database: blackbook_dev

test:
  <<: *default
  database: blackbook_test

production:
  <<: *default
  # DATABASE_URL must name localhost, so the client picks the socket below
  # rather than TCP. MySQL runs on the same machine as the container.
  url: <%= ENV['DATABASE_URL'] %>
  # Keys the URL does not set survive the merge, so the URL can still override.
  socket: /var/run/mysqld/mysqld.sock
  # Fail fast. Without this an unreachable database hangs every request until
  # the OS gives up, which reads as a slow app rather than a broken one.
  connect_timeout: 5
