inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'vendor/**/*' 
    - 'node_modules/**/*'
    - 'db/migrate/**/*'
    - 'db/schema.rb'
    - 'config/**/*'
    - 'Rakefile'
    - 'Gemfile'

# Relax some common rules for existing codebase
Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false  # Too many to fix right now

Metrics/MethodLength:
  Max: 30

Metrics/ClassLength:
  Max: 200  # ApplicationController is large

Metrics/AbcSize:
  Max: 30

# Naming conventions - existing code patterns
Naming/PredicatePrefix:
  Enabled: false

# Controllers memoize into view-facing ivars (@visualizations, @tags) from methods
# named `current_objects`. Renaming the ivar to match the method silently breaks views.
Naming/MemoizedInstanceVariableName:
  Enabled: false

# Rails specific
# Rewriting `where('approved_at < ?', ...)` to a beginless range changed which rows
# the `approved` scope returned. Not worth re-deriving query semantics for style.
Rails/WhereRange:
  Enabled: false

# `User.find_by_param` is a real class method, not a dynamic finder — rewriting it
# to `find_by(param:)` queries a column that doesn't exist.
Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_param

# All three mass-assignment sites now use `params.expect`. What's left is plain reads
# (`Tag.find(params[:id])`, `params[:user].gsub(...)`) where `expect` would only swap a
# nil for a ParameterMissing on routes that always supply the key.
Rails/StrongParametersExpect:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Rails/OutputSafety:
  Enabled: false

# RSpec specific
# The suite consistently sets up in `before` blocks and reads @tag/@user/@json in the
# examples. Converting ~77 of those to `let` is churn, not clarity.
RSpec/InstanceVariable:
  Enabled: false

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5